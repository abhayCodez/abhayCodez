  <text x="24" y="242" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="11" letter-spacing="1" fill="#FFC72C" fill-opacity="0.8">▸ github.com/abhayCodez/ryde</text>
