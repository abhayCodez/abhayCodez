  <text x="24" y="40" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12" letter-spacing="3" fill="#E0242F">MARK I · ONLINE</text>
  <text x="24" y="74" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="3" fill="url(#gold)">RYDE</text>
  <text x="24" y="99" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#F4F4F5">Ride-sharing backend · 5 Spring Boot microservices</text>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#CFFAFE">
    <text x="24" y="128"><tspan fill="#FFC72C">▸</tspan><tspan dx="8">JWT access tokens + Redis refresh-token sessions</tspan></text>
    <text x="24" y="151"><tspan fill="#FFC72C">▸</tspan><tspan dx="8">Redis GEO search for drivers within 5 km</tspan></text>
    <text x="24" y="174"><tspan fill="#FFC72C">▸</tspan><tspan dx="8">Live ride offers over Server-Sent Events</tspan></text>
  </g>
