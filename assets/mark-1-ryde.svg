<svg xmlns="http://www.w3.org/2000/svg" width="500" height="260" viewBox="0 0 500 260" role="img" aria-labelledby="title">
  <title id="title">Mark I: Ryde. Ride-sharing backend · 5 Spring Boot microservices.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0D11"/>
      <stop offset="1" stop-color="#2E070D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A3"/>
      <stop offset="0.45" stop-color="#FFC72C"/>
      <stop offset="1" stop-color="#C8930A"/>
    </linearGradient>
    <radialGradient id="glow-c">
      <stop offset="0" stop-color="#E8FEFF" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#6EF3FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00B4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core-c">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#C6FDFF"/>
      <stop offset="1" stop-color="#27D3EE"/>
    </radialGradient>
    <filter id="blur-c" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="498" height="258" rx="14" fill="url(#bg)" stroke="#FFC72C" stroke-opacity="0.55" stroke-width="1.5"/>

  <g fill="none" stroke="#FFC72C" stroke-width="2" stroke-opacity="0.9">
    <path d="M10 28V10H28"/>
    <path d="M472 10H490V28"/>
    <path d="M490 232V250H472"/>
    <path d="M28 250H10V232"/>
  </g>

