        <path d="M-10 -82L10 -82L7 -60L-7 -60Z" transform="rotate(144)"/>
        <path d="M-10 -82L10 -82L7 -60L-7 -60Z" transform="rotate(180)"/>
        <path d="M-10 -82L10 -82L7 -60L-7 -60Z" transform="rotate(216)"/>
        <path d="M-10 -82L10 -82L7 -60L-7 -60Z" transform="rotate(252)"/>
        <path d="M-10 -82L10 -82L7 -60L-7 -60Z" transform="rotate(288)"/>
        <path d="M-10 -82L10 -82L7 -60L-7 -60Z" transform="rotate(324)"/>
