    <rect x="206" y="196" width="55" height="22" rx="11" fill="#C1121F" fill-opacity="0.22" stroke="#E0242F"/>
    <text x="233.5" y="211.5" text-anchor="middle">Redis</text>
    <rect x="269" y="196" width="55" height="22" rx="11" fill="#C1121F" fill-opacity="0.22" stroke="#E0242F"/>
    <text x="296.5" y="211.5" text-anchor="middle">MySQL</text>
    <rect x="332" y="196" width="69" height="22" rx="11" fill="#C1121F" fill-opacity="0.22" stroke="#E0242F"/>
    <text x="366.5" y="211.5" text-anchor="middle">WebFlux</text>
