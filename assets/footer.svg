<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" role="img" aria-label="Systems nominal. End of transmission.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0E"/>
      <stop offset="1" stop-color="#3A080E"/>
    </linearGradient>
    <linearGradient id="left" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="440" y2="0">
      <stop offset="0" stop-color="#FFC72C" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFC72C"/>
    </linearGradient>
    <linearGradient id="right" gradientUnits="userSpaceOnUse" x1="560" y1="0" x2="940" y2="0">
      <stop offset="0" stop-color="#FFC72C"/>
      <stop offset="1" stop-color="#FFC72C" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow-f">
      <stop offset="0" stop-color="#E8FEFF" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#6EF3FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00B4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core-f">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#C6FDFF"/>
      <stop offset="1" stop-color="#27D3EE"/>
    </radialGradient>
    <filter id="blur-f" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect width="1000" height="120" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="118" rx="13" fill="none" stroke="#FFC72C" stroke-opacity="0.3"/>

  <g fill="none" stroke="#FFC72C" stroke-width="2" stroke-opacity="1.0">
    <path d="M14 34V14H34"/>
    <path d="M966 14H986V34"/>
    <path d="M986 86V106H966"/>
    <path d="M34 106H14V86"/>
  </g>
  <rect x="60" y="43" width="380" height="2" fill="url(#left)"/>
  <rect x="560" y="43" width="380" height="2" fill="url(#right)"/>

  <g transform="translate(500 44) scale(0.22)">
    <circle r="128" fill="url(#glow-f)">
      <animate attributeName="opacity" values="0.45;0.9;0.45" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="116" fill="none" stroke="#FFC72C" stroke-opacity="0.75" stroke-width="2" stroke-dasharray="2 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle r="104" fill="none" stroke="#C1121F" stroke-width="4" stroke-dasharray="48 16">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle r="92" fill="#16191E" stroke="#9AA4AE" stroke-width="6"/>
    <circle r="86" fill="none" stroke="#3A4048" stroke-width="2"/>
    <g fill="#C27A3B" stroke="#4A2A12" stroke-width="1.5">
        <path d="M-10 -82L10 -82L7 -60L-7 -60Z" transform="rotate(0)"/>
        <path d="M-10 -82L10 -82L7 -60L-7 -60Z" transform="rotate(36)"/>
        <path d="M-10 -82L10 -82L7 -60L-7 -60Z" transform="rotate(72)"/>
        <path d="M-10 -82L10 -82L7 -60L-7 -60Z" transform="rotate(108)"/>
        <path d="M-10 -82L10 -82L7 -60L-7 -60Z" transform="rotate(144)"/>
        <path d="M-10 -82L10 -82L7 -60L-7 -60Z" transform="rotate(180)"/>
        <path d="M-10 -82L10 -82L7 -60L-7 -60Z" transform="rotate(216)"/>
        <path d="M-10 -82L10 -82L7 -60L-7 -60Z" transform="rotate(252)"/>
        <path d="M-10 -82L10 -82L7 -60L-7 -60Z" transform="rotate(288)"/>
        <path d="M-10 -82L10 -82L7 -60L-7 -60Z" transform="rotate(324)"/>
    </g>
    <circle r="56" fill="#0E2A33" stroke="#7DF9FF" stroke-width="3"/>
    <circle r="46" fill="#7DF9FF" filter="url(#blur-f)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="38" fill="url(#core-f)">
      <animate attributeName="r" values="35;40;35" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="500" y="96" text-anchor="middle" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14" letter-spacing="5" fill="#FFC72C">SYSTEMS NOMINAL · END OF TRANSMISSION</text>
